openapi: 3.0.0
info:
  version: '1.0'
  title: categories-api
  
  description: |
    The Categories API allows clients to manage the project categories of a company. A category is a label that a company defines to classify its projects, for example "Country" or "Business unit". Each category has a list of allowed values, each with a name and a short code. Values are assigned to projects, and projects can be filtered by them, through the Projects API.

    The terms "company" and "account" refer to the same thing. The company ID is the same as the account ID in the Projects API.

    ## Authentication
    All requests require a Personal Access Token (PAT) in the `Authorization` header:
    - `Authorization: MxToken <Your PAT>`

    Refer to [Create a Personal Access Token](https://docs.mendix.com/portal/user-settings/#pat) for how to create a personal token.
  
  license:
    name: Mendix Terms of Use
    
  termsOfService: https://www.mendix.com/terms-of-use/
  
  contact:
    name: Mendix Support
    url: https://support.mendix.com
    email: support@mendix.com

servers:
  - url: https://categories-api.home.mendix.com/v1
    description: The production server that hosts the API

security:
  - PersonalAccessToken: []

tags:
  - name: Companies
    description: Companies on the Mendix Platform
  - name: Categories
    description: Company categories

paths:
  /companies/{company-id}/categories:
    get:
      tags:
        - Companies
      summary: Get categories for a company
      description: |
        Returns the categories that a company has defined to classify its projects, with their IDs and names.
        Use this to find a `categoryId`. To get the allowed values of a category, use the `get_category_values` operation.

        A limited number of entries are returned for each request. Use the query parameters `limit` and `offset` if you need more entries.
        
        The user PAT needs to have the scope `mx:app:categories:read`.
      operationId: get_company_categories
      parameters:
        - name: company-id
          in: path
          description: The unique identifier of the company. The same value as `account.accountId` in the Projects API.
          required: true
          schema:
            type: string
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 0
            maximum: 11
            default: 11
          description: The maximum number of items to be returned per request. The default and maximum value is 11. A limit of 0 implies a use of the default limit.
        - name: offset
          in: query
          required: false
          schema:
            type: integer
            minimum: 0
            default: 0
          description: Number of items to skip before starting to collect the result set.
      responses:
        '200':
          description: List of categories
          content:
            application/json:
              schema:
                type: object
                properties:
                  links:
                    $ref: '#/components/schemas/PaginationLinks'
                  meta:
                    $ref: '#/components/schemas/PaginationMeta'
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/Category'
        '400':
          $ref: '#/components/responses/Http400'
        '401':
          $ref: '#/components/responses/Http401'
        '404':
          $ref: '#/components/responses/Http404'
        '500':
          $ref: '#/components/responses/Http500'
    post:
      tags:
        - Companies
      summary: Create a category for a company
      description: |
        Creates a new category for classifying the company's projects, together with its allowed values. The category must include at least 2 values. Please note that a company can have a maximum of 5 categories.

        A unique 3-letter code can be included when creating new category values. If no code was included by the client, a code will be generated by the server based on the provided input for the value name.

        The user PAT needs to have the `mx:app:categories:write` scope. The requesting user must be a Mendix Admin.
      operationId: create_company_category
      parameters:
        - name: company-id
          in: path
          description: The unique identifier of the company. The same value as `account.accountId` in the Projects API.
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CategoryCreate'
      responses:
        '201':
          description: Category created
          content:
            application/json:
              schema:
                type: object
                properties:
                  categoryId:
                    type: string
                    description: Unique identifier for the category
                  name:
                    type: string
                    description: Name of the category
                  values:
                    type: array
                    description: List of values for the category
                    items:
                      $ref: '#/components/schemas/CategoryValue'
        '400':
          $ref: '#/components/responses/Http400'
        '401':
          $ref: '#/components/responses/Http401'
        '404':
          $ref: '#/components/responses/Http404'
        '409':
          $ref: '#/components/responses/Http409'
        '422':
          $ref: '#/components/responses/Http422'
        '500':
          $ref: '#/components/responses/Http500'
  /categories/{category-id}:
    put:
      tags:
        - Categories
      summary: Update a category
      description: |
        Changes the name of a category. To create, change or delete category values, use operations `add_category_values`, `update_category_value`, or `delete_category_value`.
        
        The user PAT needs to have the `mx:app:categories:write` scope. The requesting user must be a Mendix Admin.
      operationId: update_category
      parameters:
        - name: category-id
          in: path
          description: The unique identifier of the category. Returned as `categoryId` by `get_company_categories`.
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CategoryNameUpdate'
      responses:
        '200':
          description: category updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Category'
        '400':
          $ref: '#/components/responses/Http400'
        '401':
          $ref: '#/components/responses/Http401'
        '404':
          $ref: '#/components/responses/Http404'
        '409':
          $ref: '#/components/responses/Http409'
        '500':
          $ref: '#/components/responses/Http500'
    delete:
      tags:
        - Categories
      summary: Delete a category
      description: |
        Deletes a category. Deleting a category unassigns it from all projects to which it was assigned. This action is irreversible. Only use this when the intention is to explicitly delete the category.
      
        The user PAT needs to have the `mx:app:categories:write` scope. The requesting user must be a Mendix Admin.
      operationId: delete_category
      parameters:
        - name: category-id
          in: path
          description: The unique identifier of the category. Returned as `categoryId` by `get_company_categories`.
          required: true
          schema:
            type: string
      responses:
        '204':
          description: Category deleted
        '401':
          $ref: '#/components/responses/Http401'
        '404':
          $ref: '#/components/responses/Http404'
        '500':
          $ref: '#/components/responses/Http500'
  /categories/{category-id}/values:
    get:
      tags:
        - Categories
      summary: Get values for a category
      description: |
        Returns the values of a category, each with its ID, code, and name.

        A maximum of 100 values can be returned per request. Use the query parameters `limit` and `offset` if you need more values.
        Use the value name or code to filter projects by category, or to assign a category value to a project, in the Projects API.
        
        The user PAT needs to have the `mx:app:categories:read` scope.
      operationId: get_category_values
      parameters:
        - name: category-id
          in: path
          description: The unique identifier of the category. Returned as `categoryId` by `get_company_categories`.
          required: true
          schema:
            type: string
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 100
          description: Maximum number of items to return
        - name: offset
          in: query
          required: false
          schema:
            type: integer
            minimum: 0
            default: 0
          description: Number of items to skip before starting to collect the result set
      responses:
        '200':
          description: List of values
          content:
            application/json:
              schema:
                type: object
                properties:
                  links:
                    $ref: '#/components/schemas/PaginationLinks'
                  meta:
                    $ref: '#/components/schemas/PaginationMeta'
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/CategoryValue'
        '400':
          $ref: '#/components/responses/Http400'
        '401':
          $ref: '#/components/responses/Http401'
        '404':
          $ref: '#/components/responses/Http404'
        '500':
          $ref: '#/components/responses/Http500'
    post:
      tags:
        - Categories
      summary: Add values to a category
      description: |
        Adds one or more values to an existing category.
        Validation: A company allows a maximum of 250 values per category.
        The user PAT needs to have the `mx:app:categories:write` scope.
        The user must be a Mendix Admin.
        The code of the provided values can be passed as an empty string. A code will be generated based on the provided input for the values.
      operationId: add_category_values
      parameters:
        - name: category-id
          in: path
          description: The unique identifier of the category. Returned as `categoryId` by `get_company_categories`.
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                values:
                  type: array
                  minItems: 1
                  maxItems: 250
                  items:
                    $ref: '#/components/schemas/CategoryValueCreate'
      responses:
        '201':
          description: Values added
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/CategoryValue'
        '400':
          $ref: '#/components/responses/Http400'
        '401':
          $ref: '#/components/responses/Http401'
        '404':
          $ref: '#/components/responses/Http404'
        '409':
          $ref: '#/components/responses/Http409'
        '422':
          $ref: '#/components/responses/Http422'
        '500':
          $ref: '#/components/responses/Http500'
  /categories/{category-id}/values/{value-id}:
    put:
      tags:
        - Categories
      summary: Update a value of a category
      description: |
        Changes the name and code of one value of a category.
        The user PAT needs to have the `mx:app:categories:write` scope.
        The user must be a Mendix Admin.
        The code of the provided value can be passed as an empty string. A code will be generated based on the provided input for the values.
      operationId: update_category_value
      parameters:
        - name: category-id
          in: path
          description: The unique identifier of the category. Returned as `categoryId` by `get_company_categories`.
          required: true
          schema:
            type: string
        - name: value-id
          in: path
          description: The unique identifier of the category value. Returned as `valueId` by `get_category_values`.
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CategoryValueCreate'
      responses:
        '200':
          description: Value updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CategoryValue'
        '400':
          $ref: '#/components/responses/Http400'
        '401':
          $ref: '#/components/responses/Http401'
        '404':
          $ref: "#/components/responses/Http404"
        '409':
          $ref: '#/components/responses/Http409'
        '500':
          $ref: '#/components/responses/Http500'
    delete:
      tags:
        - Categories
      summary: Delete a value of a category
      description: |
        Removes the specified value from a category. The value cannot be removed if that means that less than 2 values remain.
        
        Removing the value means that it will be removed from any project to which it is assigned. This action is irreversible. Only use this when the intention is to explicitly delete the value.

        The user PAT needs to have the `mx:app:categories:write` scope. The requesting user must be a Mendix Admin.
      operationId: delete_category_value
      parameters:
        - name: category-id
          in: path
          description: The unique identifier of the category. Returned as `categoryId` by `get_company_categories`.
          required: true
          schema:
            type: string
        - name: value-id
          in: path
          description: The unique identifier of the category value. Returned as `valueId` by `get_category_values`.
          required: true
          schema:
            type: string
      responses:
        '204':
          description: Value deleted (at least two values must remain)
        '401':
          $ref: '#/components/responses/Http401'
        '404':
          $ref: '#/components/responses/Http404'
        '409':
          $ref: '#/components/responses/Http409'
        '500':
          $ref: '#/components/responses/Http500'

components:
  securitySchemes:
    PersonalAccessToken:
      type: apiKey
      name: Authorization
      in: header
      description: 'MxToken <Your PAT>'
  schemas:
    CategoryCreate:
      type: object
      required:
        - name
      properties:
        name:
          type: string
          description: Name of the category.
        values:
          type: array
          description: List of values for the category
          minItems: 2
          items:
            $ref: '#/components/schemas/CategoryValueCreate'
    CategoryValueCreate:
      type: object
      required:
        - value
      properties:
        code:
          type: string
          description: Code for the value.
        value:
          type: string
          description: The name of the value.
    Category:
      type: object
      properties:
        categoryId:
          type: string
          description: Unique identifier for the category
        name:
          type: string
          description: Name of the category
    CategoryValue:
      type: object
      properties:
        valueId:
          type: string
          description: Unique identifier for the value
        code:
          type: string
          description: Code for the value
        value:
          type: string
          description: The actual value
    CategoryNameUpdate:
      type: object
      properties:
        name:
          type: string
          description: New name for the category
    PaginationLinks:
      type: object
      properties:
        self:
          type: string
          description: URL to the current page of results
        next:
          type: string
          description: URL to the next page of results
        prev:
          type: string
          description: URL to the previous page of results
        first:
          type: string
          description: URL to the first page of results
        last:
          type: string  
          description: URL to the last page of results
    PaginationMeta:
      type: object
      properties:
        page:
          type: object
          properties:
            totalElements:
              type: integer
              description: Total number of elements available
            offset:
              type: integer
              description: Number of items skipped before starting to collect the result set
            elements:
              type: integer
              description: Number of elements returned on this page
  responses:
    Http400:
      description: 'Bad Request'
      content:
        application/json:
          schema:
            type: object
            properties:
              error:
                type: object
                description: 'Detailed information on the error'
                properties:
                  message:
                    type: string
                    description: 'A short, human-readable title for the general error type'
                    default: 'Bad Request'
                  detail:
                    type: string
                    description: 'A human-readable description of the specific error'
                  code:
                    type: integer
                    description: 'HTTP status code'
                    default: 400
                  instance:
                    type: string
                    description: 'UUID of the request for troubleshooting purposes'
                  invalid-params:
                    type: array
                    description: 'A list of invalid parameters'
                    items:
                      type: object
                      properties:
                        name:
                          type: string
                          description: 'Name of the attribute in error'
                          maxLength: 200
                        reason:
                          type: string
                          description: 'A human readable description of the error'
                          maxLength: 200
          examples:
            bad-offset:
              value:
                error:
                  message: 'Bad Request'
                  detail: 'One or more of the provided attributes are not valid'
                  code: 400
                  instance: 'urn:uuid:8c584042-0246-4306-aa68-25a407f43145'
                  invalid-params:
                    - name: 'offset'
                      reason: 'Offset must be a positive number'
    Http401:
      description: 'Unauthorized'
      content:
        application/json:
          schema:
            type: object
            properties:
              error:
                type: object
                description: 'Detailed information on the error'
                properties:
                  message:
                    type: string
                    description: 'A short, human-readable title for the general error type'
                    default: 'Unauthorized'
                  detail:
                    type: string
                    description: 'A human-readable description of the specific error'
                  code:
                    type: integer
                    description: 'HTTP status code'
                    default: 401
                  instance:
                    type: string
                    description: 'UUID of the request for troubleshooting purposes'
          examples:
            unauthorized:
              value:
                error:
                  message: 'Unauthorized'
                  detail: 'Invalid access token'
                  code: 401
                  instance: 'urn:uuid:8c584042-0246-4306-aa68-25a407f43145'
    Http404:
      description: 'Not Found'
      content:
        application/json:
          schema:
            type: object
            properties:
              error:
                type: object
                description: 'Detailed information on the error'
                properties:
                  message:
                    type: string
                    description: 'A short, human-readable title for the general error type'
                    default: 'Not Found'
                  detail:
                    type: string
                    description: 'A human-readable description of the specific error'
                  code:
                    type: integer
                    description: 'HTTP status code'
                    default: 404
                  instance:
                    type: string
                    description: 'UUID of the request for troubleshooting purposes'
          examples:
            not-found:
              value:
                error:
                  message: 'Not Found'
                  detail: ''
                  code: 404
                  instance: 'urn:uuid:8c584042-0246-4306-aa68-25a407f43145'
    Http409:
      description: 'Conflict'
      content:
        application/json:
          schema:
            type: object
            properties:
              error:
                type: object
                description: 'Detailed information on the error'
                properties:
                  message:
                    type: string
                    description: 'A short, human-readable title for the general error type'
                    default: 'Conflict'
                  detail:
                    type: string
                    description: 'A human-readable description of the specific error'
                  code:
                    type: integer
                    description: 'HTTP status code'
                    default: 409
                  instance:
                    type: string
                    description: 'UUID of the request for troubleshooting purposes'
          examples:
            conflict:
              value:
                error:
                  message: 'Conflict'
                  detail: ''
                  code: 409
                  instance: 'urn:uuid:8c584042-0246-4306-aa68-25a407f43145'
    Http422:
      description: 'Unprocessable content'
      content:
        application/json:
          schema:
            type: object
            properties:
              error:
                type: object
                description: 'Detailed information on the error'
                properties:
                  message:
                    type: string
                    description: 'A short, human-readable title for the general error type'
                    default: 'Exceeding the number of objects allowed'
                  detail:
                    type: string
                    description: 'A human-readable description of the specific error'
                  code:
                    type: integer
                    description: 'HTTP status code'
                    default: 422
                  instance:
                    type: string
                    description: 'UUID of the request for troubleshooting purposes'
          examples:
            unprocessable-content:
              value:
                error:
                  message: 'Exceeding the number of objects allowed'
                  detail: ''
                  code: 422
                  instance: 'urn:uuid:8c584042-0246-4306-aa68-25a407f43145'
    Http500:
      description: 'Internal Server Error'
      content:
        application/json:
          schema:
            type: object
            properties:
              error:
                type: object
                description: 'Detailed information on the error'
                properties:
                  message:
                    type: string
                    description: 'A short, human-readable title for the general error type'
                    default: 'Internal Server Error'
                  code:
                    type: integer
                    description: 'HTTP status code'
                    default: 500
                  instance:
                    type: string
                    description: 'UUID of the request for troubleshooting purposes'
          examples:
            wrong:
              value:
                error:
                  message: 'Internal Server Error'
                  code: 500
                  instance: 'urn:uuid:8c584042-0246-4306-aa68-25a407f43145'
