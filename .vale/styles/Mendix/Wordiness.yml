# Extends Microsoft.Wordiness (requires Vale 3.20 or later).
extends: Microsoft.Wordiness
ignorecase: false
swap+:
  # Added/changed entries
  "(?:take away|eliminate)": remove
  "(?:inform)": tell
  allows you to: lets you
  in case of: if
  doomed to fail: will fail
  in a timely manner: on time
swap-:
  # Replaced/removed entries
  - "(?:extract|take away|eliminate)"
  - "(?:inform|let me know)"
  - used for fuel purposes
