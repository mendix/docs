openapi: 3.0.4
info:
  title: Project Service v2
  version: 1.0.0
servers:
  - url: 'https://pmp-test-sgp.mxplatform.net/projectservice/v2'
paths:
  /projects:
    get:
      tags:
        - projects
      summary: Get my projects
      description: Get my project list
      parameters:
        - name: status
          in: query
          schema:
            enum:
              - Active
              - Archived
            type: string
      responses:
        '200':
          description: successful operation
    post:
      tags:
        - projects
      summary: Create a new project
      description: 'Create a new project with input app name, summary, template id'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProjectRequest'
          application/xml:
            schema:
              $ref: '#/components/schemas/ProjectRequest'
      responses:
        '200':
          description: successful operation
  '/projects/jobs/{jobId}':
    get:
      tags:
        - projects
      summary: Query project creation status
      description: Query project creation status
      parameters:
        - name: jobId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: successful operation
  '/projects/{projectId}':
    get:
      tags:
        - projects
      summary: Get a single project info with project Id
      description: Get a single project info with project Id
      parameters:
        - name: projectId
          in: path
          required: true
          schema:
            type: string
        - name: status
          in: query
          schema:
            enum:
              - Active
              - Archived
            type: string
      responses:
        '200':
          description: successful operation
    patch:
      tags:
        - projects
      summary: Change project info and status
      description: 'Change project name, description or status'
      parameters:
        - name: projectId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AppInfoInput'
          application/xml:
            schema:
              $ref: '#/components/schemas/AppInfoInput'
      responses:
        '200':
          description: successful operation
    delete:
      tags:
        - projects
      summary: Delete one project with project Id
      description: Delete one project with project Id
      parameters:
        - name: projectId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: successful operation
  '/projects/{projectId}/branches':
    get:
      tags:
        - projects
      summary: Retrive all branches of project
      description: Retrive all branches of the project
      parameters:
        - name: projectId
          in: path
          required: true
          schema:
            type: string
        - name: cursor
          in: query
          schema:
            type: integer
        - name: limit
          in: query
          schema:
            type: integer
      responses:
        '200':
          description: successful operation
  '/projects/{projectId}/branches/{branchName}/revisions':
    get:
      tags:
        - projects
      summary: Retrive all revsions on project branch
      description: Retrive all revsions on the project branch
      parameters:
        - name: projectId
          in: path
          required: true
          schema:
            type: string
        - name: branchName
          in: path
          required: true
          schema:
            type: string
        - name: cursor
          in: query
          schema:
            type: integer
        - name: limit
          in: query
          schema:
            type: integer
      responses:
        '200':
          description: successful operation
  '/projects/{projectId}/owner':
    put:
      tags:
        - projects
      summary: Change owner user and group of the project
      description: Change owner user and group of the project
      parameters:
        - name: projectId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OwnerInput_v2'
          application/xml:
            schema:
              $ref: '#/components/schemas/OwnerInput_v2'
      responses:
        '200':
          description: successful operation
  '/projects/{projectId}/sharing-groups':
    post:
      tags:
        - projects
      summary: Add groups into sharing groups of project
      description: Add the specified groups into the sharing groups of the project.
      parameters:
        - name: projectId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              type: array
              items:
                $ref: '#/components/schemas/SharingGroupsInput_v2'
          application/xml:
            schema:
              type: array
              items:
                $ref: '#/components/schemas/SharingGroupsInput_v2'
              xml:
                name: GroupInputs
                wrapped: true
      responses:
        '200':
          description: successful operation
    get:
      tags:
        - projects
      summary: Get the sharing groups of the project
      description: Get the sharing groups of the project
      parameters:
        - name: projectId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: successful operation
    delete:
      tags:
        - projects
      summary: Remove groups from sharing groups of project
      description: Remove the specified groups from the sharing groups of the project.
      parameters:
        - name: projectId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              type: array
              items:
                $ref: '#/components/schemas/SharingGroupsInput_v2'
          application/xml:
            schema:
              type: array
              items:
                $ref: '#/components/schemas/SharingGroupsInput_v2'
              xml:
                name: GroupInputs
                wrapped: true
      responses:
        '200':
          description: successful operation
  '/projects/{projectId}/sharing-users':
    post:
      tags:
        - projects
      summary: Add users into sharing users of project
      description: Add the specified users into the sharing users of the project.
      parameters:
        - name: projectId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              type: array
              items:
                $ref: '#/components/schemas/SharingUsersInput_v2'
          application/xml:
            schema:
              type: array
              items:
                $ref: '#/components/schemas/SharingUsersInput_v2'
              xml:
                name: MemberInputs
                wrapped: true
      responses:
        '200':
          description: successful operation
    get:
      tags:
        - projects
      summary: Get sharing users of project
      description: Get the sharing groups of the project
      parameters:
        - name: projectId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: successful operation
    delete:
      tags:
        - projects
      summary: Remove users from sharing users of project
      description: Remove the specified users from the sharing users of the project.
      parameters:
        - name: projectId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              type: array
              items:
                $ref: '#/components/schemas/SharingUsersInput_v2'
          application/xml:
            schema:
              type: array
              items:
                $ref: '#/components/schemas/SharingUsersInput_v2'
              xml:
                name: MemberInputs
                wrapped: true
      responses:
        '200':
          description: successful operation
  '/projects/{projectId}/team':
    post:
      tags:
        - projects
      summary: Invite users into project team
      description: Invite the specified users into the project team.
      parameters:
        - name: projectId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              type: array
              items:
                $ref: '#/components/schemas/TeamInviteInput'
          application/xml:
            schema:
              type: array
              items:
                $ref: '#/components/schemas/TeamInviteInput'
              xml:
                name: MemberInputs
                wrapped: true
      responses:
        '200':
          description: successful operation
    get:
      tags:
        - projects
      summary: Get the team members of the project
      description: Get the team members of the project
      parameters:
        - name: projectId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: successful operation
    delete:
      tags:
        - projects
      summary: Remove users from project team.
      description: Remove the specified users from the project team.
      parameters:
        - name: projectId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              type: array
              items:
                $ref: '#/components/schemas/TeamRemoveInput'
          application/xml:
            schema:
              type: array
              items:
                $ref: '#/components/schemas/TeamRemoveInput'
              xml:
                name: MemberInputs
                wrapped: true
      responses:
        '200':
          description: successful operation
  '/projects/{projectId}/team/{userId}':
    delete:
      tags:
        - projects
      summary: Remove a user from project team
      description: Remove a specified user from the project team.
      parameters:
        - name: projectId
          in: path
          required: true
          schema:
            type: string
        - name: userId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: successful operation
components:
  schemas:
    ProjectRequest:
      title: ProjectCreation
      type: object
      properties:
        name:
          type: string
        description:
          type: string
        useAppTemplate:
          type: boolean
          default: false
        appTemplate:
          title: ''
          type: object
          properties:
            templateId:
              type: string
            templateVersion:
              type: string
            versionUUID:
              type: string
        group:
          type: string
      xml:
        name: ProjectCreation
    AppInfoInput:
      title: ProjectInput
      type: object
      properties:
        name:
          type: string
        description:
          type: string
        isActive:
          type: boolean
          default: false
      xml:
        name: ProjectInput
    OwnerInput_v2:
      title: OwnerInput
      type: object
      properties:
        userId:
          type: string
        groupId:
          type: string
        userName:
          type: string
        groupName:
          type: string
      xml:
        name: OwnerInput
    SharingGroupsInput_v2:
      title: GroupInput
      type: object
      properties:
        groupId:
          type: string
        groupName:
          type: string
      xml:
        name: GroupInput
    SharingUsersInput_v2:
      title: MemberInput
      type: object
      properties:
        userId:
          type: string
        userName:
          type: string
      xml:
        name: MemberInput
    TeamInviteInput:
      title: MemberInput
      type: object
      properties:
        userId:
          type: string
        userName:
          type: string
        directRole:
          type: string
      xml:
        name: MemberInput
    TeamRemoveInput:
      title: MemberInput
      type: object
      properties:
        userId:
          type: string
        userName:
          type: string
      xml:
        name: MemberInput
tags:
  - name: projects
    description: ''
