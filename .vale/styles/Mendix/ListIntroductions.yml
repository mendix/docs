# Reference: content/en/docs/community-tools/contribute-to-mendix-docs/style-guide/grammar-formatting.md (Lists)
# Known issue: Doesn't match code font list intros
# Known issue: May flag a spaced em dash as a list introduction when it's a mid-sentence aside (Click Save — the page closes). The dash is still wrong, but the message is misleading.
extends: substitution
message: "Set off list item introductions with a spaced en dash (–), not an em dash (—) or hyphen (-)."
link: https://docs.mendix.com/community-tools/contribute-to-mendix-docs/style-guide/grammar-formatting/#en-dash
ignorecase: false
nonword: true
level: warning
scope: list
action:
  name: replace
swap:
  # Match up to 40 chars (excluding em dashes) from start of line, then replace first em dash or spaced hyphen with en dash
  # Limit to first ~40 chars to avoid matching em dashes in the middle of list text
  '^([^—]{0,40}) — ': '$1 – '  # em dash with spaces on both sides
  '^([^—]{0,40}) —': '$1 – '   # em dash with space before, no space after
  '^([^—]{0,40})— ': '$1 – '   # em dash with no space before, space after
  '^([^—]{0,40}) - (?!\d)': '$1 – '  # hyphen with spaces on both sides, unless a digit follows (a number range such as 10 - 20)
  '^([^—]{0,40}) -- (?!\d)': '$1 – '  # double hyphen with spaces on both sides, unless a digit follows
  # En dashes with wrong spacing. The docs use a non-breaking space (\xA0) before a dash to prevent a line break, so the patterns allow it.
  '^([^—–]{0,40}) –([^\s\xA0])': '$1 – $2'  # en dash with space before, no space after
  '^([^—–]{0,39}[^—–\s\xA0])– ': '$1 – '  # en dash with no space before, space after
