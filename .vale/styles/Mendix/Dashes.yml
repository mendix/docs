# Reference: content/en/docs/community-tools/contribute-to-mendix-docs/style-guide/grammar-formatting.md (Dashes)
extends: substitution
message: "Remove spaces around em dashes (—)."
link: https://docs.microsoft.com/en-us/style-guide/punctuation/dashes-hyphens/emes
ignorecase: false
nonword: true
level: error
scope:
  - paragraph
  - heading
  - list
  - table
  - blockquote
action:
  name: replace
swap:
  # Em dashes (—) should not have spaces
  ' — ': '—'
  ' —': '—'
  '— ': '—'
