# Mendix custom rule: Spelling
# Replaces Vale.Spelling so that plural acronyms (for example, APIs, JDKs) aren't flagged
# Accepted words are filters here, not a Vale vocabulary, because accepted vocabulary words also hide other rules' alerts on text that contains them
# Each word is an anchored regex (^...$) so that it doesn't hide typos that contain it
# Keep in sync with Capitalization.yml, CompoundWords.yml, and Terminology.yml:
#   - If you add a term to one of those rules and the word isn't in the dictionary, add it to "Terms covered by other rules" below. Otherwise it is flagged twice.
#   - If you remove a term from one of those rules, remove it from "Terms covered by other rules" too. Otherwise it is silently exempt from spelling checks.
extends: spelling
message: "Did you really mean '%s'?"
level: warning
# Skips bold and italic text
scope: text & ~strong & ~emphasis
filters:
  # Plural acronyms, such as APIs and JDKs
  - '[A-Z]{2,}(?:''s|s)\b'

  # Skips code-like (lowerCamelCase and snake_case) words, which are often flagged as typos. However, consider wrapping these in backticks.
  - '_'
  - '^[a-z]+([A-Z][a-z0-9]*)+$'

  # Mendix terms
  - '^Mendix(?:''s)?$'
  - '^mendix$'  # Lowercase in com.mendix names and hyphenated repo names
  - '^[Cc]onfigurator$'
  - '^Interactor$'
  - '^javascriptsource$'
  - '^javasource$'
  - '^mda$'
  - '^Medior$'
  - '^Menditect$'
