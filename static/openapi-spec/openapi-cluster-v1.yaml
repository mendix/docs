openapi: 3.0.3
info:
  title: Cluster Service v1
  version: 1.0.0
servers:
  - url: https://pmp-demo.privateplatform.mendix.com/clusterservice/v1
paths:
  /clusters:
    post:
      tags:
        - clusters
      summary: Register a new cluster
      description: Register a new cluster
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ClusterInput'
          application/xml:
            schema:
              $ref: '#/components/schemas/ClusterInput'
      responses:
        '200':
          description: successful operation
        '401':
          $ref: '#/components/responses/UnauthorizedError'
    get:
      tags:
        - clusters
      summary: Retrieve all clusters
      description: Retrieve all clusters
      parameters:
        - name: DeployMode
          in: query
          schema:
            enum:
              - Standalone
              - Connected
            type: string
      responses:
        '200':
          description: successful operation
        '401':
          $ref: '#/components/responses/UnauthorizedError'
  '/clusters/{clusterId}':
    get:
      tags:
        - clusters
      summary: Retrieve cluster by id
      description: Retrieve cluster by id
      parameters:
        - name: clusterId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: successful operation
        '401':
          $ref: '#/components/responses/UnauthorizedError'
    patch:
      tags:
        - clusters
      summary: Update configuration of cluster
      description: Update configuration of the cluster
      parameters:
        - name: clusterId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ClusterInput'
          application/xml:
            schema:
              $ref: '#/components/schemas/ClusterInput'
      responses:
        '200':
          description: successful operation
        '401':
          $ref: '#/components/responses/UnauthorizedError'
    delete:
      tags:
        - clusters
      summary: 'Delete cluster '
      description: Delete the cluster by id
      parameters:
        - name: clusterId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: successful operation
        '401':
          $ref: '#/components/responses/UnauthorizedError'
  '/clusters/{clusterId}/namespaces':
    post:
      tags:
        - clusters
      summary: Add a new namespace in cluster
      description: Add a new namespace in the cluster
      parameters:
        - name: clusterId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NamespaceInput'
          application/xml:
            schema:
              $ref: '#/components/schemas/NamespaceInput'
      responses:
        '200':
          description: successful operation
        '401':
          $ref: '#/components/responses/UnauthorizedError'
    get:
      tags:
        - clusters
      summary: Retrieve all namespaces of the cluster
      description: Retrieve all namespaces of the cluster
      parameters:
        - name: clusterId
          in: path
          required: true
          schema:
            type: string
        - name: RetrieveCluster
          in: query
          schema:
            enum:
              - 'Yes'
              - 'No'
            type: string
      responses:
        '200':
          description: successful operation
        '401':
          $ref: '#/components/responses/UnauthorizedError'
  '/clusters/{clusterId}/namespaces/{namespaceId}':
    get:
      tags:
        - clusters
      summary: Retrieve namespace of the cluster
      description: Retrieve namespace of the cluster by id
      parameters:
        - name: clusterId
          in: path
          required: true
          schema:
            type: string
        - name: namespaceId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: successful operation
        '401':
          $ref: '#/components/responses/UnauthorizedError'
    patch:
      tags:
        - clusters
      summary: Update configuration of namespace in cluster
      description: Update configuration of the namespace in the cluster
      parameters:
        - name: clusterId
          in: path
          required: true
          schema:
            type: string
        - name: namespaceId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NamespaceInput'
          application/xml:
            schema:
              $ref: '#/components/schemas/NamespaceInput'
      responses:
        '200':
          description: successful operation
        '401':
          $ref: '#/components/responses/UnauthorizedError'
    delete:
      tags:
        - clusters
      summary: Delete namespace in cluster
      description: Delete the namespace in the cluster by id
      parameters:
        - name: clusterId
          in: path
          required: true
          schema:
            type: string
        - name: namespaceId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: successful operation
        '401':
          $ref: '#/components/responses/UnauthorizedError'
  '/clusters/{clusterId}/namespaces/{namespaceId}/install-command':
    get:
      tags:
        - clusters
      summary: Get installation command for namespace
      description: Get installation command for namespace
      parameters:
        - name: clusterId
          in: path
          required: true
          schema:
            type: string
        - name: namespaceId
          in: path
          required: true
          schema:
            type: string
        - name: OperatingSystem
          in: query
          schema:
            enum:
              - Windows
              - macOS
              - Linux
            type: string
      responses:
        '200':
          description: successful operation
        '401':
          $ref: '#/components/responses/UnauthorizedError'
  '/clusters/{clusterId}/namespaces/{namespaceId}/plans':
    post:
      tags:
        - clusters
      summary: Add a new plan in cluster namespace
      description: Add a new plan in the namespace of the cluster
      parameters:
        - name: clusterId
          in: path
          required: true
          schema:
            type: string
        - name: namespaceId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PlanInput'
          application/xml:
            schema:
              $ref: '#/components/schemas/PlanInput'
      responses:
        '200':
          description: successful operation
        '401':
          $ref: '#/components/responses/UnauthorizedError'
    get:
      tags:
        - clusters
      summary: Retrive all plans of namespace
      description: Retrive all plans of the namespace
      parameters:
        - name: clusterId
          in: path
          required: true
          schema:
            type: string
        - name: namespaceId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: successful operation
        '401':
          $ref: '#/components/responses/UnauthorizedError'
  '/clusters/{clusterId}/namespaces/{namespaceId}/plans/{planId}':
    get:
      tags:
        - clusters
      summary: Retrive plan of namespace
      description: Retrive the plan of the namespace with id.
      parameters:
        - name: clusterId
          in: path
          required: true
          schema:
            type: string
        - name: namespaceId
          in: path
          required: true
          schema:
            type: string
        - name: planId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: successful operation
        '401':
          $ref: '#/components/responses/UnauthorizedError'
    patch:
      tags:
        - clusters
      summary: Update plan configuration of namespace in cluster
      description: Update plan configuration of the namespace in the cluster
      parameters:
        - name: clusterId
          in: path
          required: true
          schema:
            type: string
        - name: namespaceId
          in: path
          required: true
          schema:
            type: string
        - name: planId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PlanInput'
          application/xml:
            schema:
              $ref: '#/components/schemas/PlanInput'
      responses:
        '200':
          description: successful operation
        '401':
          $ref: '#/components/responses/UnauthorizedError'
    delete:
      tags:
        - clusters
      summary: Delete plan of namespace in cluster
      description: Delete the plan of the namespace in the cluster
      parameters:
        - name: clusterId
          in: path
          required: true
          schema:
            type: string
        - name: namespaceId
          in: path
          required: true
          schema:
            type: string
        - name: planId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: successful operation
        '401':
          $ref: '#/components/responses/UnauthorizedError'
components:
  schemas:
    ClusterInput:
      title: cluster
      type: object
      properties:
        clusterName:
          type: string
        clusterType:
          enum:
            - AKS
            - EKS
            - GKE
            - OpenShift
            - Kubernetes
          type: string
        deployMode:
          enum:
            - Standalone
            - Connected
          type: string
        apiServerURL:
          type: string
        token:
          type: string
        secretSource:
          enum:
            - AWS
            - DB
            - AZURE
            - HASHICORP
          type: string
        secretName:
          type: string
        enableLogging:
          enum:
            - 'Yes'
            - 'No'
          type: string
        enableMonitoring:
          enum:
            - 'Yes'
            - 'No'
          type: string
        registryOciURL:
          type: string
        grafanaConfig:
          title: ''
          type: object
          properties:
            host:
              type: string
            apiKey:
              type: string
            datasourceType:
              enum:
                - Loki
                - Azure_Monitor
              type: string
            loki:
              type: string
            prometheus:
              type: string
            secretSource:
              enum:
                - AWS
                - DB
                - AZURE
                - HASHICORP
              type: string
            secretName:
              type: string
            azureMonitorName:
              type: string
            aksName:
              type: string
            aksResourceID:
              type: string
        description:
          type: string
      xml:
        name: cluster
    NamespaceInput:
      title: namespace
      type: object
      properties:
        namespace:
          type: string
        isShared:
          enum:
            - 'Yes'
            - 'No'
          type: string
        enableSecretStore:
          enum:
            - 'Yes'
            - 'No'
          type: string
        useCustomCoreResourcePlan:
          enum:
            - 'Yes'
            - 'No'
          type: string
        secretStoreType:
          enum:
            - MANUAL
            - AUTOMATIC
          type: string
      xml:
        name: namespace
    PlanInput:
      title: plan
      type: object
      properties:
        planId:
          type: string
        planName:
          type: string
        planType:
          enum:
            - Database
            - Storage
            - CustomCoreResource
          type: string
        isActive:
          enum:
            - 'Yes'
            - 'No'
          type: string
        cpuLimit:
          type: number
        cpuRequest:
          type: number
        memoryLimit:
          type: number
        memoryRequest:
          type: number
        ephemeralLimit:
          type: number
        ephemeralRequest:
          type: number
      xml:
        name: plan
  responses:
    UnauthorizedError:
      description: Authentication information is missing or invalid
      headers:
        WWW-Authenticate:
          schema:
            type: string
  securitySchemes:
    basicAuth:
      type: http
      scheme: basic
security:
  - basicAuth: []
tags:
  - name: clusters
    description: ''
