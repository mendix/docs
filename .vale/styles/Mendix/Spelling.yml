# Mendix custom rule: Spelling
# Replaces Vale.Spelling so that plural acronyms (for example, APIs, JDKs) aren't flagged
# Accepted words are filters here, not a Vale vocabulary, because accepted vocabulary words also hide other rules' alerts on text that contains them
# Each word is an anchored regex (^...$) so that it doesn't hide typos that contain it
extends: spelling
message: "Did you really mean '%s'?"
level: warning
filters:
  # Plural acronyms, such as APIs and JDKs
  - '[A-Z]{2,}s\b'

  # Mendix terms
  - '^Mendix(?:''s)?$'
  - '^[Cc]onfigurator$'
  - '^Interactor$'
  - '^javascriptsource$'
  - '^javasource$'
  - '^mda$'
  - '^Medior$'
  - '^Menditect$'
  - '^[Mm]etamodel$'
  - '^[Mm]icroflows?$'
  - '^mpk$'
  - '^mpr$'
  - '^[Mm]x$'
  - '^[Mm]xbuild$'
  - '^[Nn]anoflows?$'
  - '^Quickstarter$'
  - '^[Rr]ecommenders?$'
  - '^themesource$'
  - '^userlibs?$'
  - '^vendorlib$'

