# Merges with _default/config.toml if --environment development
# Need to set _merge = 'deep' to overwrite original value
# =============================================================

baseURL = "https://docs-development.mendix.com/"
title = "Mendix DEVELOPMENT Documentation"

# In development we want to build everything
buildDrafts=true
buildExpired=true
buildFuture=true

# Disable print output format in development. Production still generates print versions
[outputs]
  _merge = 'deep'
  section = ["HTML"]
  page = ["HTML"]

[build]
  _merge = "shallow"  # Force override production settings
  buildDrafts = true
  buildFuture = true

[caches.assets]
  maxAge = "1h"  # Shorter cache for active development