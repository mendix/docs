openapi: 3.0.1
info:
  version: 1.0.0
  title: PMP Release Service v1
  description: "Provide services for automating Private Mendix Platform package downloads. List the available Private Mendix Platform release versions and get the manifest of a specific version.\r\n\r\nThese APIs do not require authorization.\r\n"
servers:
  - url: 'https://privateplatform.mendix.com/rest/pmpreleaseservice/v1'
paths:
  /versions:
    get:
      tags:
        - versions
      summary: Get Private Mendix Platform release version list
      description: |-
        ## Get Private Mendix Platform release version list

        Returns all Private Mendix Platform release versions, newest first. A version can include release labels such as (LTS), (MTS) or (LATEST).
      operationId: getVersions
      responses:
        '200':
          $ref: '#/components/responses/versions'

  '/versions/{version}/manifest':
    get:
      tags:
        - versions
      summary: Get the manifest of a specific Private Mendix Platform version
      description: |-
        ## Get the manifest of a specific Private Mendix Platform version

        Returns the container images, Helm charts and custom artifacts of the given Private Mendix Platform version.

        The version must be the full value returned by `GET /versions`, including release labels (for example `2.8.1 (LTS) (LATEST)`), URL-encoded.
      operationId: getVersionManifest
      parameters:
        - $ref: '#/components/parameters/version'
      responses:
        '200':
          $ref: '#/components/responses/manifest'
        '404':
          $ref: '#/components/responses/error-404'


components:
  parameters:
    version:
      name: version
      in: path
      description: Private Mendix Platform release version, as returned by GET /versions
      required: true
      schema:
        type: string
        example: 2.8.1 (LTS) (LATEST)


  responses:
    versions:
      description: Private Mendix Platform release versions
      content:
        application/json:
          schema:
            type: array
            items:
              $ref: '#/components/schemas/Version'
          examples:
            Version list:
              value:
                - version: 2.8.1 (LTS) (LATEST)
                - version: 2.8.0 (LTS)
                - version: 2.7.0
                - version: 2.6.1
    manifest:
      description: Manifest of the Private Mendix Platform version
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Manifest'
          examples:
            Manifest:
              value:
                name: downloadportal
                versions:
                  - ver: downloadportalpackage
                    description: The packages of PMP release 2.8.1 (LTS) (LATEST)
                    images:
                      - name: mendix-operator:2.28.1
                        address: registry.mendix.com/private-cloud/mendix-operator:2.28.1
                    charts:
                      - name: mxplatform:2.8.1
                        address: registry.mendix.com/private-platform/charts/mxplatform:2.8.1
                    custom-artifacts:
                      - name: installer-helmfile:2.8.1
                        address: registry.mendix.com/private-platform/installer-helmfile:2.8.1
                latest: downloadportalpackage
    error-404:
      description: Version not found
      content:
        application/json:
          schema:
            type: string
          examples:
            404 - Not found:
              value: Not found PMP release version 0.2.1

  schemas:
    Version:
      type: object
      title: Version
      description: Private Mendix Platform release version
      properties:
        version:
          type: string
          description: Version, optionally followed by release labels
          example: 2.8.1 (LTS) (LATEST)
      required:
        - version

    Manifest:
      type: object
      title: Manifest
      description: Manifest of a Private Mendix Platform version
      properties:
        name:
          type: string
          description: Manifest name
          example: downloadportal
        versions:
          type: array
          description: Packages of the version
          items:
            $ref: '#/components/schemas/Package'
      required:
        - name
        - versions

    Package:
      type: object
      title: Package
      description: Package of a Private Mendix Platform version
      properties:
        ver:
          type: string
          description: Package identifier
          example: downloadportalpackage
        description:
          type: string
          description: Package description
          example: The packages of PMP release 2.8.1 (LTS) (LATEST)
        images:
          type: array
          description: Container images
          items:
            $ref: '#/components/schemas/Artifact'
        charts:
          type: array
          description: Helm charts
          items:
            $ref: '#/components/schemas/Artifact'
        custom-artifacts:
          type: array
          description: Custom artifacts
          items:
            $ref: '#/components/schemas/Artifact'

    Artifact:
      type: object
      title: Artifact
      description: Container image, Helm chart or custom artifact
      properties:
        name:
          type: string
          description: Artifact name and tag
          example: mendix-operator:2.28.1
        address:
          type: string
          description: Registry address of the artifact
          example: registry.mendix.com/private-cloud/mendix-operator:2.28.1
      required:
        - name
        - address

security: []
tags:
  - name: versions
