# Reference: content/en/docs/community-tools/contribute-to-mendix-docs/style-guide/grammar-formatting.md (Dashes)
# Known gap: This rule doesn't scope list items, to avoid double alerts with Mendix.ListIntroductions, which flags a dash in the first 40 characters. A spaced em dash later in a list item isn't flagged.
extends: substitution
message: "Remove spaces around the em dash (—)."
link: https://docs.mendix.com/community-tools/contribute-to-mendix-docs/style-guide/grammar-formatting/#em-dash
ignorecase: false
nonword: true
level: error
scope:
  - paragraph
  - heading
  - table
  - blockquote
action:
  name: replace
swap:
  # Em dashes (—) should not have spaces
  ' — ': '—'
  ' —': '—'
  '— ': '—'
