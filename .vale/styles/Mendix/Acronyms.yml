# Extends Microsoft.Acronyms (requires Vale 3.20 or later).
# Ensures that the existence of 'first' implies the existence of 'second'.
# Link text is excluded from the scope (& ~link), so acronyms that appear only as link text aren't flagged (but also aren't counted as definitions).
extends: Microsoft.Acronyms
message: "Define '%s' on first use."
link: https://docs.mendix.com/community-tools/contribute-to-mendix-docs/style-guide/grammar-formatting/#acronyms-and-initialisms
scope:
  - paragraph & ~link
  - heading & ~link
  - list & ~link
  - table & ~link
  - blockquote & ~link
# Modified from Microsoft.Acronyms to accept sentence-case definitions (e.g., "personal access token (PAT)" not just "Personal Access Token (PAT)")
# and plural definitions (e.g., "personal access tokens (PATs)")
second: '\(([A-Z]{3,5})s?\)'
# ... with the exception of these (and the Microsoft.Acronyms exceptions):
exceptions+:
  - ATS
  - AWS
  - BTP
  - DNS
  - GCP
  - GIF
  - HANA
  - IAM
  - JDBC
  - JPEG
  - JPG
  - JVM
  - MCP
  - MDA
  - MIME
  - MPR
  - NGINX
  - OIDC
  - OQL
  - PNG
  - REST
  - SAML
  - SAP
  - SMS
  - SMTP
  - SOAP
  - SSO
  - TLS
  - UTC
  - UUID

# Flagged by Mendix.Uppercase, so don't flag them here
  - MUST
  - NEVER
  - NOT
  - ONLY

# Part of the NOT FOUND status text, which Mendix.Uppercase allows
  - FOUND
