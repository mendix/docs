# Merges with _default/config.toml if --environment internal
# Configuration for internal Siemens documentation deployment
# Need to set _merge = 'deep' to overwrite original value
# =============================================================

baseURL = "https://internal.docs.sw.siemens.com/documentation/internal/PL20260323299104942/en-US/Mendix-Docs/public/"
title = "Mendix Documentation (Internal)"

# Convert all absolute paths (starting with /) to use the full baseURL
# This fixes images and most links. The CSS path doubling issue can be fixed with post-processing.
canonifyURLs = true

# Disable robots.txt for internal deployment
enableRobotsTXT = false

# Enable ugly URLs to help links work on the Siemens site 
uglyURLs = true