  schemas:
    EnvironmentCreateRequest:
      title: EnvironmentCreateRequest
      description: Request to create a new environment.
      type: object
      properties:
        displayName:
          type: string
          description: Display name of the environment
          example: Env-Dev
        clusterName:
          type: string
          description: Cluster name where the environment will be deployed
          example: cluster-dev
        namespace:
          type: string
          description: Namespace for the environment
          example: namespace-dev
        storagePlanName:
          type: string
          description: Name of the storage plan for the environment
          example: storage-dev
        databasePlanName:
          type: string
          description: Name of the database plan for the environment
          example: database-dev
        deploymentPackageName:
          type: string
          description: Name of the package for the deployment
          example: mh-local-ui102413-5e6a49a5.mda
        deploymentPurpose:
          enum:
            - Development
            - Test
            - Acceptance
            - Production
          type: string
          description: Purpose for the deployment
          example: Development          
        coreResourcePlan:
          type: string
          description: Core Resource Plan for environment creation, it's only for connected mode.
          example: low-level
        coreResourceSize:
          enum:
            - Small
            - Medium
            - Large
            # - Custom
          type: string
          description: "Core Resource Size for environment, not support Custom Size for environment creation. If need, please use PATCH API to config Custom Size after environment created."
          default: Small
      required:
        - displayName
        - clusterName
        - namespace
        - storagePlanName
        - databasePlanName
        - deploymentPackageName
        - deploymentPurpose

    ConfigurationPatchRequest:
      title: ConfigurationPatchRequest
      description: Request to change environment configurations and settings
      type: object
      properties:
        displayName:
          type: string
          description: Display name of the environment
          example: Env-Dev
        dtapMode:
          type: string
          description: DTAP mode of the environment can be Development or Production
          example: Development
        replicas:
          type: integer
          description: Replicas of the environment
          example: 1
        appUrl:
          type: string
          description: URL of the app deployed in the environment
          example: "https://project-a-env.portunus.mxplatform.net/"
        adminPassword:
          type: string
          description: Admin password of the app deployed in the environment
          example: "[MxAdminPassword]"
        leaderlessMode:
          type: boolean
          description: Indicate if the environment is in leaderless mode
          example: false

        Constants:
          description: Constants of the app deployed in the environment
          type: array
          items:
            title: Constants
