openapi: 3.0.4
info:
  title: Marketplace Service
  description: >-
    Use Marketplace Service API to manage marketplace content items
    (Packages/Versions).
  version: 1.0.0
servers:
  - url: 'https://pmp-test-sgp.mxplatform.net/marketplaceservice/v1'
paths:
  /packages:
    get:
      tags:
        - packages
      summary: Get packages (content items)
      description: "## Use this GET operation to retrieve all content items.\r\n\r\n### Filtering:\r\nOptionally you can filter the list with query parameters. All of them are optional.\r\n\r\n- name = Package name.\r\n\r\n- modelerMajorVersion = 7, 8, 9 or 10 for Studio Pro major version.\r\n\r\n- owner= Package owner user name.\r\n\r\n- visibility = All if retrive the packages visible to all users, Group if retrive the packages visible to users in the packge owner and sharing groups.\r\n\r\n\r\n### Paging:\r\nOptionally you can get the big query list in a few pages.\r\n\r\n- Limit = The maximum amount of packages to return. If Limit is not specified, default all are returned.\r\n\r\n- Offset = Offset says to skip that many objects before beginning to return objects in the response. Usually used in combination with Limit."
      parameters:
        - name: name
          in: query
          schema:
            type: string
        - name: appContentTypeName
          in: query
          schema:
            type: string
        - name: appCategoryName
          in: query
          schema:
            type: string
        - name: modelerMajorVersion
          in: query
          schema:
            type: integer
        - name: ownerUserName
          in: query
          schema:
            type: string
        - name: visibility
          in: query
          schema:
            enum:
              - All
              - Group
            type: string
        - name: status
          in: query
          schema:
            enum:
              - Draft
              - WaitingForApproval
              - Declined
              - Published
              - Retired
            type: string
        - name: limit
          in: query
          schema:
            type: integer
        - name: offset
          in: query
          schema:
            type: integer
      responses:
        '200':
          description: successful operation
        '401':
          $ref: '#/components/responses/UnauthorizedError'
    post:
      tags:
        - packages
      summary: Create new package (content item)
      description: "### Use the POST method as a first step to create a new content item.\r\n\r\nNote the following:\r\n- This operation will create a new package in marketplace and an initial 1.0.0 version if no version specified.\r\n- The Status of the initial version of package will be Draft.\r\n"
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PackageInput'
          application/xml:
            schema:
              $ref: '#/components/schemas/PackageInput'
      responses:
        '200':
          description: successful operation
        '401':
          $ref: '#/components/responses/UnauthorizedError'
  '/packages/{packageId}/versions':
    get:
      tags:
        - packages
      summary: Get versions of existing package (content item)
      description: Get versions of existing package (content item) by package number
      parameters:
        - name: packageId
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: successful operation
        '401':
          $ref: '#/components/responses/UnauthorizedError'
    post:
      tags:
        - packages
      summary: Create new version of existing package (content item)
      description: "### Use this POST operation to create a new version of an existing content item\r\n\r\nNote:\r\n- This operation will create a new Version of the existing package.\r\n- The Status of the Version will be Draft.\r\n"
      parameters:
        - name: packageId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VersionInput'
          application/xml:
            schema:
              $ref: '#/components/schemas/VersionInput'
      responses:
        '200':
          description: successful operation
        '401':
          $ref: '#/components/responses/UnauthorizedError'
  '/packages/{packageId}':
    get:
      tags:
        - packages
      summary: Get a single package (content item)
      description: Get a package by package number
      parameters:
        - name: packageId
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: successful operation
        '401':
          $ref: '#/components/responses/UnauthorizedError'
    put:
      tags:
        - packages
      summary: Update package (content item)
      description: "### Use the PUT method to edit a newly posted package (content item).\r\n\r\nNote the following:\r\n- This operation applies only to newly created content items that have not been published yet.\r\n- This operation cannot be used to edit new versions of already existing packages (content items).\r\n- Only the creator of a package is able to edit it and thus use this operation.\r\n"
      parameters:
        - name: packageId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PackageInput'
          application/xml:
            schema:
              $ref: '#/components/schemas/PackageInput'
      responses:
        '200':
          description: successful operation
        '401':
          $ref: '#/components/responses/UnauthorizedError'
    delete:
      tags:
        - packages
      summary: Delete the marketplace content that is not published
      description: Delete the marketplace content that is not published.
      parameters:
        - name: packageId
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: successful operation
        '401':
          $ref: '#/components/responses/UnauthorizedError'
  '/packages/{packageId}/groups':
    get:
      tags:
        - packages
      summary: Get share groups of package
      description: Get share groups of package.
      parameters:
        - name: packageId
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: successful operation
        '401':
          $ref: '#/components/responses/UnauthorizedError'
  '/packages/{packageId}/requests':
    post:
      tags:
        - packages
      summary: >-
        Add or delete the groups from the sharing group list of the marketplace
        content
      description: >-
        Add or delete the groups from the sharing group list of the marketplace
        content
      parameters:
        - name: packageId
          in: path
          required: true
          schema:
            type: integer
        - name: type
          in: query
          schema:
            enum:
              - Add
              - Delete
            type: string
        - name: objectType
          in: query
          schema:
            enum:
              - Group
            type: string
      requestBody:
        content:
          application/json:
            schema:
              type: array
              items:
                $ref: '#/components/schemas/ObjectInput'
          application/xml:
            schema:
              type: array
              items:
                $ref: '#/components/schemas/ObjectInput'
              xml:
                name: ObjectInputs
                wrapped: true
      responses:
        '200':
          description: successful operation
        '401':
          $ref: '#/components/responses/UnauthorizedError'
  '/packages/{packageId}/owner':
    put:
      tags:
        - packages
      summary: Transfer the owner of marketplace content to the user in the group
      description: Transfer the owner of marketplace content to the user in the group
      parameters:
        - name: packageId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OwnerInput'
          application/xml:
            schema:
              $ref: '#/components/schemas/OwnerInput'
      responses:
        '200':
          description: successful operation
        '401':
          $ref: '#/components/responses/UnauthorizedError'
  '/packages/{packageId}/request':
    put:
      tags:
        - packages
      summary: >-
        Request to publish/approve/decline/retire/unretire a package (content
        item)
      description: "### Use this PUT method  to publish/approve/decline/retire/unretire a content item that was created using the POST /package operation\r\n\r\nNote the following:\r\n- To publish package content will result in submitting the content for approval.\r\n- Admin or owner user of package are able to publish/retire/unretire package.\r\n- Only Admin is able to approve/decline package for publishing."
      parameters:
        - name: packageId
          in: path
          required: true
          schema:
            type: integer
        - name: type
          in: query
          schema:
            enum:
              - Publish
              - Approve
              - Decline
              - Retire
              - UnRetire
            type: string
        - name: reason
          in: query
          schema:
            type: string
      responses:
        '200':
          description: successful operation
        '401':
          $ref: '#/components/responses/UnauthorizedError'
  '/versions/{versionId}/download':
    get:
      tags:
        - versions
      summary: Downloads a published content
      description: Downloads a published content
      parameters:
        - name: versionId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: successful operation
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        '401':
          $ref: '#/components/responses/UnauthorizedError'
  '/versions/{versionId}':
    get:
      tags:
        - versions
      summary: Get a single version of an existing package
      parameters:
        - name: versionId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: successful operation
        '401':
          $ref: '#/components/responses/UnauthorizedError'
    put:
      tags:
        - versions
      summary: Update a single version of an existing package
      description: Update a single version of an existing package
      parameters:
        - name: versionId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VersionInput'
          application/xml:
            schema:
              $ref: '#/components/schemas/VersionInput'
      responses:
        '200':
          description: successful operation
        '401':
          $ref: '#/components/responses/UnauthorizedError'
    delete:
      tags:
        - versions
      summary: Delete the specific version of the package
      description: Delete the specific version of the package
      parameters:
        - name: versionId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: successful operation
        '401':
          $ref: '#/components/responses/UnauthorizedError'
  '/versions/{versionId}/request':
    put:
      tags:
        - versions
      summary: Request to publish/retire/unretire a version of package
      description: "### Use this PUT method  to publish/retire/unretire a version of an existing content item that was created using the POST /version operation\r\n\r\nNote:\r\n- Admin and owner of package can publish/retire/unretire version of package."
      parameters:
        - name: versionId
          in: path
          required: true
          schema:
            type: string
        - name: type
          in: query
          schema:
            type: string
      responses:
        '200':
          description: successful operation
        '401':
          $ref: '#/components/responses/UnauthorizedError'
  /appcontenttypes:
    get:
      tags:
        - appcontenttypes
      summary: Query all AppContentTypes
      description: Query all AppContentTypes
      responses:
        '200':
          description: successful operation
        '401':
          $ref: '#/components/responses/UnauthorizedError'
  '/appcategories/{appCategoryId}':
    get:
      tags:
        - appcategories
      summary: Get a single AppCategory by id
      description: Get a single AppCategory by id
      parameters:
        - name: appCategoryId
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: successful operation
        '401':
          $ref: '#/components/responses/UnauthorizedError'
    put:
      tags:
        - appcategories
      summary: Edit one existing AppCategory by id
      description: Edit one existing AppCategory by id
      parameters:
        - name: appCategoryId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/appCategoryInput'
          application/xml:
            schema:
              $ref: '#/components/schemas/appCategoryInput'
      responses:
        '200':
          description: successful operation
        '401':
          $ref: '#/components/responses/UnauthorizedError'
    delete:
      tags:
        - appcategories
      summary: Delete one existing AppCategory by id
      description: Delete one existing AppCategory by id
      parameters:
        - name: appCategoryId
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: successful operation
        '401':
          $ref: '#/components/responses/UnauthorizedError'
  /appcategories:
    post:
      tags:
        - appcategories
      summary: Create a new AppCategory
      description: Create a new AppCategory
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/appCategoryInput'
          application/xml:
            schema:
              $ref: '#/components/schemas/appCategoryInput'
      responses:
        '200':
          description: successful operation
        '401':
          $ref: '#/components/responses/UnauthorizedError'
    get:
      tags:
        - appcategories
      summary: Get All Categories
      responses:
        '200':
          description: successful operation
        '401':
          $ref: '#/components/responses/UnauthorizedError'
  /taxonomy/studioproversions:
    get:
      tags:
        - taxonomy
      responses:
        '200':
          description: successful operation
        '401':
          $ref: '#/components/responses/UnauthorizedError'
  /taxonomy/licenses:
    get:
      tags:
        - taxonomy
      responses:
        '200':
          description: successful operation
        '401':
          $ref: '#/components/responses/UnauthorizedError'
  /taxonomy/industries:
    get:
      tags:
        - taxonomy
      responses:
        '200':
          description: successful operation
        '401':
          $ref: '#/components/responses/UnauthorizedError'
components:
  schemas:
    PackageInput:
      title: PackageInput
      type: object
      properties:
        name:
          type: string
        description:
          type: string
        studioProVersion:
          type: string
        appContentTypeName:
          type: string
        visibility:
          enum:
            - All
            - Group
          type: string
        ownerGroupName:
          type: string
        license:
          type: string
        logoFile:
          type: string
        versionMajor:
          type: integer
          format: int32
        versionMinor:
          type: integer
          format: int32
        versionPatch:
          type: integer
          format: int32
        releaseNotes:
          type: string
        documentation:
          type: string
        screenshotInputs:
          type: array
          items:
            title: screenshotInput
            type: object
            properties:
              base64EncodedContent:
                type: string
              fileName:
                type: string
            xml:
              name: screenshotInput
          xml:
            wrapped: true
        sourceFileInput:
          title: ''
          type: object
          properties:
            base64EncodedContent:
              type: string
            fileName:
              type: string
        appCategories:
          type: array
          items:
            title: appCategory
            type: object
            properties:
              name:
                type: string
            xml:
              name: appCategory
          xml:
            wrapped: true
        industries:
          type: array
          items:
            title: Industry
            type: object
            properties:
              Name:
                type: string
            xml:
              name: Industry
          xml:
            wrapped: true
        isReadyForReact:
          type: boolean
          default: false
        tagline:
          type: string
      xml:
        name: PackageInput
    VersionInput:
      title: VersionInput
      type: object
      properties:
        description:
          type: string
        studioProVersion:
          type: string
        license:
          type: string
        logoFile:
          type: string
        versionMajor:
          type: integer
          format: int32
        versionMinor:
          type: integer
          format: int32
        versionPatch:
          type: integer
          format: int32
        releaseNotes:
          type: string
        documentation:
          type: string
        sourceFileInput:
          title: ''
          type: object
          properties:
            base64EncodedContent:
              type: string
            fileName:
              type: string
        screenshotInputs:
          type: array
          items:
            title: screenshotInput
            type: object
            properties:
              base64EncodedContent:
                type: string
              fileName:
                type: string
            xml:
              name: screenshotInput
          xml:
            wrapped: true
      xml:
        name: VersionInput
    ObjectInput:
      title: ObjectInput
      type: object
      properties:
        name:
          type: string
      xml:
        name: ObjectInput
    OwnerInput:
      title: OwnerInput
      type: object
      properties:
        userName:
          type: string
        groupName:
          type: string
      xml:
        name: OwnerInput
    appCategoryInput:
      title: AppCategoryInput
      type: object
      properties:
        appCategoryName:
          type: string
        customized:
          type: boolean
          default: false
      xml:
        name: AppCategoryInput
  responses:
    UnauthorizedError:
      description: Authentication information is missing or invalid
      headers:
        WWW-Authenticate:
          schema:
            type: string
  securitySchemes:
    basicAuth:
      type: http
      scheme: basic
security:
  - basicAuth: []
tags:
  - name: packages
    description: ''
  - name: versions
    description: ''
  - name: appcontenttypes
    description: ''
  - name: appcategories
    description: ''
  - name: taxonomy
    description: ''
