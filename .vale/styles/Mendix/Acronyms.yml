# Extends Microsoft.Acronyms (requires Vale 3.20 or later).
# Ensures that the existence of 'first' implies the existence of 'second'.
# Link text is excluded from the scope (& ~link), so acronyms that appear only as link text aren't flagged.
# Known issue: Definitions inside link text aren't recognized, so later plain uses of the acronym are flagged
extends: Microsoft.Acronyms
message: "Define '%s' on first use."
link: https://docs.mendix.com/community-tools/contribute-to-mendix-docs/style-guide/grammar-formatting/#acronyms-and-initialisms
scope:
  - paragraph & ~link
  - heading & ~link
  - list & ~link
  - table & ~link
  - blockquote & ~link
# Modified from Microsoft.Acronyms to accept sentence-case definitions (e.g., "personal access token (PAT)" not just "Personal Access Token (PAT)")
second: '(?:\b[A-Za-z][a-z]+ )+\(([A-Z]{3,5})\)'
# ... with the exception of these (and the Microsoft.Acronyms exceptions):
exceptions+:
  - BTP
  - GIF
  - HANA
  - JDBC
  - JPEG
  - JPG
  - MCP
  - MDA
  - MPR
  - PNG
  - REST
  - SAP
