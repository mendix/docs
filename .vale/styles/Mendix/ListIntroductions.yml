# Reference: content/en/docs/community-tools/contribute-to-mendix-docs/style-guide/grammar-formatting.md (Lists)
extends: substitution
message: "Set off list item introductions with an en dash (–), not an em dash (—)."
ignorecase: false
nonword: true
level: error
scope: list
swap:
  # Match up to 40 chars + word/slash/digit + space + em dash + space
  '^.{0,40}([a-zA-Z0-9/]) — ': '$1 – '
  # Match up to 40 chars + word/slash/digit + space + em dash no trailing space
  '^.{0,40}([a-zA-Z0-9/]) —': '$1 – '
  # Match up to 40 chars + word/slash/digit + em dash + space no leading space
  '^.{0,40}([a-zA-Z0-9/])— ': '$1 – '
  # Match up to 40 chars + word/slash/digit + em dash no spaces
  '^.{0,40}([a-zA-Z0-9/])—': '$1 – '
