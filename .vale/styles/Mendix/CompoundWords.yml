# Mendix custom rule: Compound word formatting
# Reference: content/en/docs/community-tools/contribute-to-mendix-docs/style-guide/terminology.md
# See specific terms: checkbox, dataset, endpoint, home page
extends: substitution
message: "Use '%s' instead of '%s'"
level: error
ignorecase: false
scope:
  - paragraph
  - heading
  - list
  - table
  - blockquote
action:
  name: replace
swap:
  'data[ -]set': 'dataset'
  'Data[ -]set': 'Dataset'
  'end point': 'endpoint'
  'End point': 'Endpoint'
  'check box': 'checkbox'
  'Check box': 'Checkbox'
  'home-?page': 'home page'
  'Home-?page': 'Home page'
  'end user': 'end-user'
  'End user': 'End-user'
